name: XenDroid One
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xendroid-one-${{ github.ref }}
  cancel-in-progress: false
jobs:
  arm64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize pinned dependencies
        run: |
          # Android does not need desktop SDKs or sample/media submodules.
          python3 tools/one/init_submodules.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.12+8'
      - name: Install host tools and pinned Android toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools ninja-build
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' \
            "ndk;$ANDROID_NDK_VERSION" 'cmake;3.30.3' 'platform-tools'
          printf 'sdk.dir=%s\ncmake.dir=%s/cmake/3.30.3\n' "$ANDROID_SDK_ROOT" "$ANDROID_SDK_ROOT" > local.properties
      - name: Check ARM64 vector instruction semantics
        run: |
          python3 -m pip install unicorn==2.1.4
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          python3 tools/one/test_neon_permute.py
      - name: Set increasing release versions
        run: |
          echo "XONE_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "XONE_CODE=$((100000 + GITHUB_RUN_NUMBER * 2))" >> "$GITHUB_ENV"
      - name: Build ARM64 and run frontend unit tests
        run: |
          ./gradlew :app:assembleRelease :app:testReleaseUnitTest \
            -PxoneVersionCode="$XONE_CODE" -PxoneVersionName="$XONE_VERSION-rc1" \
            --no-daemon --max-workers=4
      - name: Retain unsigned PR output
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XenDroid-One-unsigned-ARM64
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign two consecutive releases with the persistent identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          XONE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XONE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XONE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export XONE_KEYSTORE="$RUNNER_TEMP/xendroid-one.p12"
          trap 'rm -f "$XONE_KEYSTORE"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Persistent signing secrets are required'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$XONE_KEYSTORE"
          mkdir -p dist
          FIRST="dist/XenDroid-One-v$XONE_VERSION-rc1-arm64.apk"
          FINAL="dist/XenDroid-One-v$XONE_VERSION-arm64.apk"
          python3 tools/one/sign_apk.py app/build/outputs/apk/release/app-release-unsigned.apk "$FIRST"
          ./gradlew :app:assembleRelease -PxoneVersionCode="$((XONE_CODE + 1))" \
            -PxoneVersionName="$XONE_VERSION" --no-daemon --max-workers=4
          python3 tools/one/sign_apk.py app/build/outputs/apk/release/app-release-unsigned.apk "$FINAL"
          python3 tools/one/validate_apk.py "$FINAL" --previous "$FIRST" \
            --expected-cert "$(cat docs/one/release-certificate.sha256)" --output dist/validation.json
          sha256sum dist/*.apk > dist/SHA256SUMS
      - name: Retain signed builds and verification
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XenDroid-One-signed-ARM64-${{ env.XONE_VERSION }}
          path: dist/
      - name: Publish versioned release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'ARM64 release built from %s.\n\n<!-- xendroid-one-version-code:%s -->\n\nSee docs/one for core scope, backup instructions and unverified device tests.\n' \
            "$GITHUB_SHA" "$((XONE_CODE + 1))" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$XONE_VERSION" "dist/XenDroid-One-v$XONE_VERSION-arm64.apk" \
            dist/validation.json dist/SHA256SUMS --target "$GITHUB_SHA" \
            --title "XenDroid One $XONE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
